task: real_lm
seed: 0
model_name: baseline
device: auto
batch_size: 128
learning_rate: 0.0005
weight_decay: 0.01
grad_clip: 1.0
max_steps: 28931
num_epochs: 5
eval_every: 500
eval_max_batches: 100
final_eval_max_batches:
val_fraction: 0.05
block_stride:
log_path: logs/full_baseline.jsonl
csv_path: logs/full_baseline.csv
tokenizer:
  kind: tiktoken
  encoding: gpt2
  cache_dir: data/tiktoken_cache
data:
  source: tinystories
  split: train
  cache_dir: data/hf_cache
  offline: true
  max_examples: null
  max_chars: null
model:
  vocab_size: 257
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  context_length: 128
  mlp_ratio: 4.0
  dropout: 0.0
  tie_embeddings: true
  memory_dim: 64
  num_memory_tokens: 8
  recurrent_memory_dim:
  recurrent_update_rank: 4
  recurrent_compressed_attention: true
  recurrent_learned_initial: false
  param_padding: 0
  chunk_size: 64
