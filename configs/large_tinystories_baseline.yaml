task: real_lm
seed: 0
model_name: baseline
device: auto
batch_size: 64
learning_rate: 0.0003
weight_decay: 0.01
grad_clip: 1.0
max_steps:
num_epochs: 1
eval_every: 500
eval_max_batches: 100
final_eval_max_batches:
block_stride:
log_path: logs/large_tinystories_baseline.jsonl
csv_path: logs/large_tinystories_baseline.csv
checkpoint_dir: checkpoints/large_tinystories_baseline
save_every: 5000
generation:
  enabled: true
  prompt: "Once upon a time, there was a little rabbit"
  max_new_tokens: 80
  every_steps: 1000
  print_at_step_one: false
  temperature: 0.8
  top_k: 50
tokenizer:
  kind: tiktoken
  encoding: gpt2
  cache_dir: data/tiktoken_cache
data:
  source: tinystories
  split: train
  cache_dir: data/hf_cache
  cache_tokens: true
  token_cache_dir: data/token_cache
  offline: true
  max_examples: null
  max_chars: null
validation_data:
  source: tinystories
  split: validation
  cache_dir: data/hf_cache
  token_cache_dir: data/token_cache
  offline: true
  max_examples: null
  max_chars: null
model:
  vocab_size: 257
  hidden_size: 384
  num_layers: 8
  num_heads: 8
  context_length: 128
  mlp_ratio: 4.0
  dropout: 0.0
  tie_embeddings: true
  memory_dim: 128
  num_memory_tokens: 8
  recurrent_memory_dim:
  recurrent_update_rank: 4
  recurrent_compressed_attention: true
  recurrent_learned_initial: false
  recurrent_update_style: "cross_attention"
  param_padding: 0
  chunk_size: 64
