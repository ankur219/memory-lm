task: real_lm
seed: 0
model_name: per_token
device: auto
batch_size: 8
learning_rate: 0.0005
weight_decay: 0.01
grad_clip: 1.0
max_steps:
num_epochs: 1
eval_every: 50
val_fraction: 0.05
block_stride:
log_path: logs/real_per_token.jsonl
csv_path: logs/real_per_token.csv
generation:
  enabled: true
  prompt: "Once upon a time, there was a little rabbit"
  max_new_tokens: 80
  temperature: 0.8
  top_k: 50
tokenizer:
  kind: tiktoken
  encoding: gpt2
  cache_dir: data/tiktoken_cache
data:
  source: tinystories
  split: train
  cache_dir: data/hf_cache
  offline: false
  max_examples: 1000
  max_chars: 1000000
model:
  vocab_size: 257
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  context_length: 128
  mlp_ratio: 4.0
  dropout: 0.0
  tie_embeddings: true
  memory_dim: 64
  num_memory_tokens: 8
  recurrent_memory_dim:
  recurrent_update_rank: 4
  recurrent_compressed_attention: true
  recurrent_learned_initial: false
  param_padding: 50176
  chunk_size: 64
