seed: 0
model_name: baseline
device: auto
batch_size: 8
learning_rate: 0.0003
weight_decay: 0.01
grad_clip: 1.0
max_steps: 100
eval_every: 10
log_path: logs/research_30m_example.jsonl
csv_path: logs/research_30m_example.csv
dataset:
  num_examples: 1000
  num_pairs: 12
  num_keys: 64
  num_values: 100
  seed: 0
model:
  vocab_size: 174
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  context_length: 512
  mlp_ratio: 4.0
  dropout: 0.0
  tie_embeddings: true
  memory_dim: 128
  num_memory_tokens: 8
  recurrent_memory_dim:
  recurrent_update_rank: 4
  recurrent_compressed_attention: true
  recurrent_learned_initial: false
  param_padding: 0
  chunk_size: 128
